[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beer-app-adgarnier"
version = "1.0.0"
description = "Python-based app for tracking yer pub'lishes"
authors = [
    { name = "Andy Garnier" },
    { name = "Andrew Berley" },
    { name = "Josef Amin" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib"
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]
docs = [
    "sphinx",
]

[project.scripts]
beer-app = "beer_app.run:main"
oxford-pub-map = "beer_app.oxford_map:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beer_app = ["data/*.csv", "templates/*.html", "templates/*.css", "templates/*.js", "images/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

# The docstring rules are deliberately not selected here. The Docstrings
# workflow runs them separately, with "ruff check --select D src/", so that
# documentation is a stage of its own rather than more lint noise. The
# convention below is what makes the full D set usable: it disables the rules
# that contradict numpydoc, which is the style this package is written in.
[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["beer_app"]
