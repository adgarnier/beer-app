<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oxford Pub Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <style>
    html, body, #map { height: 100%; margin: 0; }
    body { font-family: system-ui, sans-serif; }
    .map-title {
      background: rgb(255 255 255 / 92%);
      border-radius: 4px;
      box-shadow: 0 1px 5px rgb(0 0 0 / 35%);
      color: #222;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
      padding: 0.55rem 0.75rem;
    }
  </style>
</head>
<body>
  <main id="map" aria-label="Interactive map of Oxford"></main>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const oxford = [51.7520, -1.2577];
    const map = L.map("map").setView(oxford, 14);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    }).addTo(map);

    L.marker(oxford)
      .addTo(map)
      .bindPopup("Oxford city centre");

    const title = L.control({ position: "topright" });
    title.onAdd = () => {
      const element = L.DomUtil.create("div", "map-title");
      element.textContent = "Oxford Pub Map";
      return element;
    };
    title.addTo(map);
  </script>
</body>
</html>
